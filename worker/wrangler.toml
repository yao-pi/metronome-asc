name = "metronome-asc-auth"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Publishes to https://metronome-asc-auth.<your-subdomain>.workers.dev, which is
# what ../config.js points BACKEND_URL at. Explicit so the URL cannot silently
# disappear behind a routes change.
workers_dev = true

[vars]
# Origins allowed to call this worker (comma-separated, no trailing slash).
# An origin has no path, so the GitHub Pages entry covers /metronome-asc/ too.
ALLOWED_ORIGINS = "https://yao-pi.github.io,http://localhost:8000"

# Session lifetime, in seconds.
SESSION_TTL = "43200"

# The single product this app sells. Both are enforced against the payment Pi
# reports, so changing the price here without changing config.js in the front
# end will reject every payment.
PRODUCT_ID = "developer-tip"
PRODUCT_AMOUNT = "0.01"

# Secrets, never put here:
#   npx wrangler secret put SESSION_SECRET      # HMAC key for our sessions
#   npx wrangler secret put PI_NETWORK_API_KEY  # Server API Key, Pi Developer Portal
#
# Only payments need the Server API Key. Sign-in validates an access token
# against /v2/me with the user's own Bearer token and needs no key at all.

[observability]
enabled = true
